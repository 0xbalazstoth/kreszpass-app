# GitHub Pages telepítés: minden main-re küldéskor (vagy kézzel) újraépíti és kiteszi az appot.
# A public/osm csempék nincsenek a repóban, ezért itt készülnek el a Geofabrik kivonatból (npm run osm).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # A ~300 MB-os OSM-kivonatot hetente egyszer töltjük le, közben a gyorsítótárból jön
      - name: Week key for OSM cache
        id: week
        run: echo "key=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .cache/osm
          key: osm-${{ steps.week.outputs.key }}
          restore-keys: osm-

      - run: npm run osm

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
